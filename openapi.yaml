openapi: 3.0.3
info:
  title: Turbo Capture API
  description: |
    Screenshot capture service: headless Chrome (puppeteer, stealth plugin) loads a
    public web page and returns a PNG.

    **Security model**
    - Every request Chrome makes (page, redirects, images, iframes, fetch/XHR,
      WebSockets, WebRTC TURN) goes through an in-process egress proxy that resolves
      the host once, refuses the request if any resolved address is not public
      unicast, and connects to the validated IP. Loopback, private, link-local /
      cloud-metadata, CGNAT, reserved, multicast, unique-local IPv6 and
      NAT64/IPv4-mapped forms of those are refused, as are `localhost` and
      `*.localhost`.
    - Only ports 80, 443, 8080 and 8443 are reachable by default.
    - A top-level URL that redirects (HTTP or JavaScript) to a refused destination
      fails with `400 Forbidden URL`.

    **Limits**
    - A fixed number of captures run at once (default 2) with a small queue; when
      both are full the service answers `503` with `Retry-After`.
    - Each capture has a hard deadline (default 60 s) covering launch, navigation,
      waits, lazy-load scrolling and the screenshot (`504` when exceeded).
    - Full-page screenshots are clipped to a maximum height (default 16384 px);
      `clipped` says whether that happened.
    - Free-tier rate limit per client IP (default 3/min, 1/min with x402 enabled).
  version: 0.1.0
  contact:
    name: Turbo Capture Support
    url: https://github.com/vilenarios/turbo-capture-service
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: https://vilenarios.com/local/capture
    description: Production server (ar.io gateway)
  - url: http://localhost:3001
    description: Local development server

tags:
  - name: Health
    description: Service health and monitoring
  - name: Screenshot
    description: Screenshot capture endpoints

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Service health, uptime, capture statistics and current load.
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /screenshot:
    post:
      tags:
        - Screenshot
      summary: Capture screenshot
      description: |
        Capture a PNG screenshot of a public HTTP(S) URL.

        **Rate limit and payment**
        - Free tier: `RATE_LIMIT_PER_MINUTE` requests per client IP per minute
          (default 3, or 1 when x402 is enabled). Behind a reverse proxy the client
          IP comes from `X-Forwarded-For` only when the operator sets `TRUST_PROXY`.
        - With x402 enabled, a client over the free tier gets `402 Payment Required`
          (x402 v2, `PAYMENT-REQUIRED` header) and may retry with a
          `PAYMENT-SIGNATURE` header. Requests carrying a payment header skip the
          free-tier limiter but must pass payment verification; a missing, malformed
          or invalid payment gets `402` and no capture runs. Payment is settled only
          when the capture succeeds.
        - Paid requests are still subject to the concurrency limit (`503`).

        **Process**
        1. Validate the body strictly and pre-check the URL (fast `400`).
        2. Wait for a capture slot (`503` when the queue is full).
        3. Launch a fresh Chrome whose traffic all goes through the egress proxy.
        4. Navigate (wait for network idle, bounded), wait `waitFor` ms.
        5. For `fullPage`, scroll (bounded by steps and time) to trigger lazy content.
        6. Screenshot (full page clipped to the maximum height), close Chrome.
      operationId: captureScreenshot
      parameters:
        - in: header
          name: PAYMENT-SIGNATURE
          schema:
            type: string
          required: false
          description: x402 v2 payment payload (base64), only when x402 is enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScreenshotRequest'
            examples:
              basic:
                summary: Basic screenshot
                value:
                  url: "https://example.com"
              custom:
                summary: Custom viewport and wait
                value:
                  url: "https://example.com"
                  viewportWidth: 1920
                  viewportHeight: 1080
                  waitFor: 15000
              mobile:
                summary: Mobile viewport, visible area only
                value:
                  url: "https://example.com"
                  viewportWidth: 375
                  viewportHeight: 667
                  fullPage: false
      responses:
        '200':
          description: Screenshot captured
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreenshotResponse'
        '400':
          description: Invalid request or forbidden destination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingUrl:
                  value: { error: "URL is required", message: "url is required", requestId: "6f1c2c8e-1d1b-4c43-9a51-2f0f0e9f4a11" }
                invalidProtocol:
                  value: { error: "Invalid protocol", message: "Only HTTP and HTTPS URLs are allowed", requestId: "6f1c2c8e-1d1b-4c43-9a51-2f0f0e9f4a11" }
                invalidField:
                  value: { error: "Invalid waitFor", message: "waitFor must be an integer between 0 and 30000", requestId: "6f1c2c8e-1d1b-4c43-9a51-2f0f0e9f4a11" }
                unknownField:
                  value: { error: "Invalid request", message: "Unknown field(s): foo", requestId: "6f1c2c8e-1d1b-4c43-9a51-2f0f0e9f4a11" }
                forbiddenUrl:
                  value: { error: "Forbidden URL", message: "Cannot capture localhost, private-network or reserved addresses", requestId: "6f1c2c8e-1d1b-4c43-9a51-2f0f0e9f4a11" }
                forbiddenPort:
                  value: { error: "Forbidden URL", message: "This port is not allowed", requestId: "6f1c2c8e-1d1b-4c43-9a51-2f0f0e9f4a11" }
                unresolvable:
                  value: { error: "Forbidden URL", message: "The host name could not be resolved", requestId: "6f1c2c8e-1d1b-4c43-9a51-2f0f0e9f4a11" }
                redirectBlocked:
                  value: { error: "Forbidden URL", message: "The page redirected to a forbidden destination", requestId: "6f1c2c8e-1d1b-4c43-9a51-2f0f0e9f4a11" }
                invalidJson:
                  value: { error: "Invalid JSON", message: "Request body is not valid JSON", requestId: "6f1c2c8e-1d1b-4c43-9a51-2f0f0e9f4a11" }
        '402':
          description: Payment required (x402 v2; only when x402 is enabled)
          headers:
            PAYMENT-REQUIRED:
              schema:
                type: string
              description: Base64-encoded x402 v2 payment requirements.
        '413':
          description: Request body larger than 10 kB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Content-Type is not application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Free-tier rate limit exceeded (x402 disabled)
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error (details are logged server-side under the request id)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The page could not be loaded (DNS failure, connection refused, TLS error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: All capture slots and the queue are full; retry after the given delay
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example: { error: "Service busy", message: "All capture slots are busy. Retry later.", requestId: "6f1c2c8e-1d1b-4c43-9a51-2f0f0e9f4a11" }
        '504':
          description: The capture exceeded the per-request deadline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example: { error: "Capture timed out", message: "The capture did not finish within 60000 ms", requestId: "6f1c2c8e-1d1b-4c43-9a51-2f0f0e9f4a11" }

components:
  headers:
    X-Request-Id:
      schema:
        type: string
        format: uuid
      description: Request id, also included in error bodies and server logs.

  schemas:
    ScreenshotRequest:
      type: object
      additionalProperties: false
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          description: Public HTTP or HTTPS URL. No credentials, no other schemes.
          example: "https://example.com"
          minLength: 1
          maxLength: 2048
        waitFor:
          type: integer
          description: Extra wait in milliseconds after load (clamped so the capture fits in the deadline)
          default: 10000
          minimum: 0
          maximum: 30000
        viewportWidth:
          type: integer
          default: 1280
          minimum: 320
          maximum: 3840
        viewportHeight:
          type: integer
          default: 800
          minimum: 240
          maximum: 2160
        fullPage:
          type: boolean
          description: Capture the whole scrollable page (clipped to the maximum height) or just the viewport
          default: true
        quality:
          type: integer
          description: Accepted for compatibility and ignored (output is always PNG)
          minimum: 1
          maximum: 100

    ScreenshotResponse:
      type: object
      required: [screenshot, finalUrl, title, size, capturedAt, viewport, height, clipped, requestId]
      properties:
        screenshot:
          type: string
          format: byte
          description: Base64-encoded PNG
        finalUrl:
          type: string
          format: uri
          description: URL after redirects
        title:
          type: string
        size:
          type: integer
          description: PNG size in bytes
        capturedAt:
          type: string
          format: date-time
        viewport:
          type: object
          required: [width, height]
          properties:
            width:
              type: integer
            height:
              type: integer
        height:
          type: integer
          description: Height of the PNG in pixels
        clipped:
          type: boolean
          description: True when the page was taller than the maximum screenshot height
        requestId:
          type: string
          format: uuid

    HealthResponse:
      type: object
      required: [status, service, version, captures, totalBytes, totalBytesFormatted, uptime, uptimeSeconds, activeCaptures, queuedCaptures]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          example: "turbo-capture"
        version:
          type: string
          example: "0.1.0"
        captures:
          type: integer
          description: Screenshots captured since start-up
        totalBytes:
          type: integer
        totalBytesFormatted:
          type: string
          example: "50 MB"
        uptime:
          type: string
          example: "5h 23m 42s"
        uptimeSeconds:
          type: integer
        activeCaptures:
          type: integer
          description: Captures running now
        queuedCaptures:
          type: integer
          description: Requests waiting for a slot

    ErrorResponse:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: string
          description: Error category
        message:
          type: string
          description: Client-safe explanation (no internal details)
        requestId:
          type: string
          format: uuid
          description: Quote this when reporting a problem; it keys the server logs

  securitySchemes: {}

security: []
